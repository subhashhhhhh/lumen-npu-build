name: Compile for Qualcomm and MediaTek NPUs
on:
  workflow_dispatch:
    inputs:
      vendor:
        description: Whose NPUs, when no chips are given
        type: choice
        options: [qualcomm, mediatek]
        default: qualcomm
      socs:
        description: Chips, space separated (SM… Qualcomm, MT… MediaTek); empty - every phone chip of the vendor
        default: ""
      models:
        description: Models in the inputs release, space separated
        default: siglip_visual ocr_det
      flags:
        description: Extra Qualcomm compiler flags (e.g. --qualcomm_vtcm_size=2)
        default: ""
      variant:
        description: Suffix for the output folder and release (e.g. _vtcm2), so a variant doesn't replace the standard build
        default: ""
      huggingface:
        description: Also upload to huggingface.co/subhashhhhhh/lumen-npu
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  chips:
    runs-on: ubuntu-22.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - id: list
        env:
          # Every phone chip LiteRT's compilers know.
          QUALCOMM: SM4250 SM4350 SM4375 SM4450 SM4635 SM6115 SM6125 SM6150 SM6225 SM6250 SM6350 SM6375 SM6450 SM6450Q SM6475 SM6650 SM7150 SM7225 SM7250 SM7315 SM7325 SM7350 SM7435 SM7450 SM7475 SM7550 SM7635 SM7675 SM7750 SM8325 SM8350 SM8350P SM8450 SM8475 SM8550 SM8635 SM8650 SM8735 SM8750 SM8845 SM8845P SM8850
          MEDIATEK: MT6853 MT6877 MT6878 MT6879 MT6886 MT6893 MT6895 MT6897 MT6983 MT6985 MT6989 MT6991 MT6993 MT8171 MT8188 MT8189
        run: |
          socs='${{ inputs.socs }}'
          [ -n "$socs" ] || { [ '${{ inputs.vendor }}' = mediatek ] && socs=$MEDIATEK || socs=$QUALCOMM; }
          echo "list=$(echo "$socs" | xargs -n1 | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
  # One runner per chip, all at once: a large model takes minutes per chip, so one runner doing
  # every chip in turn took hours.
  compile:
    needs: chips
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        soc: ${{ fromJSON(needs.chips.outputs.list) }}
    steps:
      - name: Free disk space (Qualcomm's SDK is several GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.11"
      - id: vendor
        run: echo "sdk=$(case '${{ matrix.soc }}' in MT*) echo mediatek;; *) echo qualcomm;; esac)" >> "$GITHUB_OUTPUT"
      # pip builds Qualcomm's SDK into a 2.6 GB wheel for ~10 minutes; keep the installed result instead.
      - uses: actions/cache@v4
        id: cache
        with:
          path: ${{ env.pythonLocation }}
          key: litert-2.3.0-${{ steps.vendor.outputs.sdk == 'mediatek' && 'mediatek-' || '' }}${{ steps.python.outputs.python-version }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: pip install --no-cache-dir ai-edge-litert==2.3.0 ai-edge-litert-sdk-${{ steps.vendor.outputs.sdk }}==2.3.0
      - name: Download the models
        run: for model in ${{ inputs.models }}; do gh release download inputs --dir in --pattern "$model.tflite"; done
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Compile
        run: |
          free -h | head -2
          soc=${{ matrix.soc }}
          for model in ${{ inputs.models }}; do
            # A failed compile can leave an empty file behind; drop it so nothing half-made is published.
            # A stuck compile stops after 20 minutes instead of holding the runner for hours.
            QUALCOMM_FLAGS="${{ inputs.flags }}" timeout 1200 python compile.py "in/$model.tflite" "$soc" "out/${soc}${{ inputs.variant }}" || { echo "::warning::$model failed for $soc"; rm -f "out/${soc}${{ inputs.variant }}/${model}_"*; }
          done
          find out -type f -empty -delete
          find out -type d -empty -delete
      # Release files, not artifacts: artifact downloads crawl (~200 KB/s) from India, release files don't.
      - name: Publish to compiled-<chip> releases
        if: ${{ !inputs.huggingface }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob  # nothing compiled: no literal out/*/ (and no compiled-* tag)
          for dir in out/*/; do
            soc=$(basename "$dir")
            gh release view "compiled-$soc" >/dev/null 2>&1 || gh release create "compiled-$soc" --title "compiled-$soc" --notes "Models compiled ahead of time for $soc." || gh release view "compiled-$soc" >/dev/null
            gh release upload "compiled-$soc" "$dir"*.tflite --clobber
          done
      # <chip>/<model>.tflite in the public model repo Lumen downloads from.
      - name: Upload to Hugging Face
        if: inputs.huggingface
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          rm -rf in
          pip install --quiet huggingface_hub
          mkdir hf
          df -h /
          shopt -s nullglob  # nothing compiled: no literal out/*/ (and no compiled-* tag)
          for dir in out/*/; do
            soc=$(basename "$dir"); mkdir "hf/$soc"
            for f in "$dir"*.tflite; do
              # <model>_<Vendor>_<chip>….tflite → <model>.tflite. Moved, not copied: 40 chips' models are ~8 GB, more than the runner has twice over.
              name=$(basename "$f"); name=${name%%_Qualcomm_*}; mv "$f" "hf/$soc/${name%%_MediaTek_*}.tflite"
            done
          done
          ls -R hf | head -40
          # Every chip's runner commits to the same repo at about the same time: retry a commit that collides.
          for try in 1 2 3 4 5; do
            hf upload subhashhhhhh/lumen-npu hf . --commit-message "Compile ${{ inputs.models }} for ${{ matrix.soc }} (run ${{ github.run_id }})" && break
            [ "$try" = 5 ] && exit 1; sleep $((RANDOM % 30 + 10))
          done
