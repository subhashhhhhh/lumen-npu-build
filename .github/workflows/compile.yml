name: Compile for Qualcomm NPUs
on:
  workflow_dispatch:
    inputs:
      socs:
        description: Chips, as a JSON list
        default: '["SM7450","SM8450","SM8475","SM8550","SM8650","SM8750","SM7475","SM7550"]'
      models:
        description: Models in the inputs release, as a JSON list
        default: '["siglip_visual","ocr_det","ocr_rec"]'
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        soc: ${{ fromJSON(inputs.socs) }}
        model: ${{ fromJSON(inputs.models) }}
    steps:
      - name: Free disk space (Qualcomm's SDK is several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --no-cache-dir ai-edge-litert==2.3.0 ai-edge-litert-sdk-qualcomm==2.3.0
      - run: gh release download inputs --pattern "${{ matrix.model }}.tflite" --dir in
        env:
          GH_TOKEN: ${{ github.token }}
      - run: df -h / && du -sh $(python -c 'import site;print(site.getsitepackages()[0])')
      - run: python compile.py "in/${{ matrix.model }}.tflite" "${{ matrix.soc }}" out
      # A release, not an artifact: artifact downloads crawl (~200 KB/s) from India, release files don't.
      - name: Publish to the compiled-<chip> release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "compiled-${{ matrix.soc }}" >/dev/null 2>&1 || gh release create "compiled-${{ matrix.soc }}" --title "compiled-${{ matrix.soc }}" --notes "Models compiled ahead of time for ${{ matrix.soc }}." || true
          for f in out/*.tflite; do gh release upload "compiled-${{ matrix.soc }}" "$f" --clobber; done
