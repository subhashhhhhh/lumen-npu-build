name: Compile for Qualcomm NPUs
on:
  workflow_dispatch:
    inputs:
      socs:
        description: Chips, space separated
        default: SM7450 SM8450 SM8475 SM8550 SM8650 SM8750 SM7475 SM7550
      models:
        description: Models in the inputs release, space separated
        default: siglip_visual ocr_det ocr_rec
permissions:
  contents: write
jobs:
  # One job for every chip and model: setting up Qualcomm's SDK is the slow part, compiling takes seconds.
  compile:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space (Qualcomm's SDK is several GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.11"
      # pip builds Qualcomm's SDK into a 2.6 GB wheel for ~10 minutes; keep the installed result instead.
      - uses: actions/cache@v4
        id: cache
        with:
          path: ${{ env.pythonLocation }}
          key: litert-2.3.0-${{ steps.python.outputs.python-version }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: pip install --no-cache-dir ai-edge-litert==2.3.0 ai-edge-litert-sdk-qualcomm==2.3.0
      - run: gh release download inputs --dir in
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Compile
        run: |
          for soc in ${{ inputs.socs }}; do
            for model in ${{ inputs.models }}; do
              python compile.py "in/$model.tflite" "$soc" "out/$soc" || echo "::warning::$model failed for $soc"
            done
          done
      # Release files, not artifacts: artifact downloads crawl (~200 KB/s) from India, release files don't.
      - name: Publish to compiled-<chip> releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for dir in out/*/; do
            soc=$(basename "$dir")
            gh release view "compiled-$soc" >/dev/null 2>&1 || gh release create "compiled-$soc" --title "compiled-$soc" --notes "Models compiled ahead of time for $soc."
            gh release upload "compiled-$soc" "$dir"*.tflite --clobber
          done
