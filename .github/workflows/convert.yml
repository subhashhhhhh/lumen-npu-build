name: Convert a model to LiteRT
on:
  workflow_dispatch:
    inputs:
      model:
        description: Script in convert/ (without .py); the result goes to the inputs release as <model>.tflite
        default: birefnet_lite
      name:
        description: File name for the result (default - the model's)
        default: ""
      args:
        description: Extra arguments for the script (e.g. 768)
        default: ""
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install --quiet --extra-index-url https://download.pytorch.org/whl/cpu --pre litert-torch==0.10.0
          pip install --quiet "transformers>=4.56" timm einops kornia safetensors huggingface_hub
          # torchvision built for the torch the converter pinned (timm and kornia pull an unmatched one).
          torch_version=$(python -c "import torch; print(torch.__version__.split('+')[0])")
          pip install --quiet --force-reinstall --no-deps --index-url https://download.pytorch.org/whl/cpu "torchvision" "torch==$torch_version"
          python -c "import torch, torchvision; print(torch.__version__, torchvision.__version__)"
      - run: python convert/${{ inputs.model }}.py ${{ inputs.name || inputs.model }}.tflite ${{ inputs.args }}
      - run: ls -l ${{ inputs.name || inputs.model }}* && gh release upload inputs ${{ inputs.name || inputs.model }}.tflite ${{ inputs.name || inputs.model }}_input.bin ${{ inputs.name || inputs.model }}_reference.bin --clobber
        env:
          GH_TOKEN: ${{ github.token }}
