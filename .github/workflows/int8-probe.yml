name: Which layers break the 8-bit cutout model
on:
  workflow_dispatch:
    inputs:
      model:
        description: LiteRT model in the inputs release (float32)
        default: birefnet_student_512
      variants:
        description: Space separated (see convert/int8_probe.py)
        default: all8 softmax attention norm fc gelu elementwise output conv8
      check:
        description: COCO val photos to check each variant on
        default: "20"
permissions:
  contents: read
jobs:
  variants:
    runs-on: ubuntu-22.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - id: list
        run: echo "list=$(echo '${{ inputs.variants }}' | xargs -n1 | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
  probe:
    needs: variants
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.variants.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet ai-edge-quantizer ai-edge-litert pillow
      - name: Download the model and COCO's validation photos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download inputs --dir in -p "${{ inputs.model }}.tflite"
          curl -sSfL -o val2017.zip http://images.cocodataset.org/zips/val2017.zip
          unzip -q val2017.zip && rm val2017.zip
      - name: Quantize and check
        run: python convert/int8_probe.py "in/${{ inputs.model }}.tflite" ${{ matrix.variant }} val2017 64 ${{ inputs.check }}
